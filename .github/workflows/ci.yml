name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every action is pinned to a commit, with its version beside it: a tag can be moved to other code.
# Dependabot (.github/dependabot.yml) proposes the bumps.
jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          use-installer: true
      - run: sam validate --lint
        env:
          AWS_DEFAULT_REGION: ap-south-1  # no credentials: the lint reads the file alone
      # Two more readers of the template. They report and never fail the build: their findings are advice to
      # weigh (a customer-managed key on every log group, for one), not rules this project has agreed to.
      - run: pipx run cfn-lint==1.57.2 template.yaml
        continue-on-error: true
      - run: pipx run checkov==3.3.26 --file template.yaml --framework cloudformation --quiet --compact --soft-fail
      - run: docker build -t dhool-analysis backend  # the analysis image: its pinned requirements still install together

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      # Known vulnerabilities in what the analysis container and the tests install.
      - run: pip-audit -r backend/requirements-analysis.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm audit --audit-level=high && npm test && npm run lint && npm run build
        working-directory: web
      # One look in a real browser: every verdict state in both languages, and the built app under its headers.
      - run: npx playwright install --with-deps chromium-headless-shell && npm run e2e
        working-directory: web

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # gitleaks reads every commit, not only the newest
      # Both tools are release binaries checked against a hash written here, not marketplace actions.
      - name: No secret in any commit (gitleaks; known false alarms are in .gitleaksignore)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts=--all --redact --no-banner
      - name: The three Dockerfiles (hadolint)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/hadolint" | sha256sum -c
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" backend/Dockerfile vision/Dockerfile messages/Dockerfile
