name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint
        env:
          AWS_DEFAULT_REGION: ap-south-1  # no credentials: the lint reads the file alone
      - run: docker build -t dhool-analysis backend  # the analysis image: its pinned requirements still install together

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
