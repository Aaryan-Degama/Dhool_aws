name: CodeQL

# Needs a public repository (or GitHub Advanced Security on a private one); until then the upload is refused.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1'  # weekly: new queries are run over old code too

permissions:
  contents: read

jobs:
  analyze:
    # Skipped (grey, not red) while the repository is private: GitHub refuses the upload there without code scanning.
    # To see it run: make the repository public, or enable code scanning in Settings and remove this line.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # asked for on a private repository
      security-events: write   # to file the findings under Security > Code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none  # both are read as source; nothing to compile
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
