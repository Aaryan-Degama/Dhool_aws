AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dhool backend. Cognito sign-in, HTTP API, DynamoDB, screenshot uploads read by a vision model, pvlib analysis, demo inverter cloud.

Parameters:
  WebOrigin:
    Type: String
    Default: '*'  # ponytail: tighten to the Amplify URL once it exists (one override: WebOrigin=https://...)
    Description: The web app's origin, for CORS on the API and on screenshot uploads.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Where alarms are emailed. Empty means the alarm topic has no subscriber.
  VapidParam:
    Type: String
    Default: /dhool/vapid-private-key
    Description: Name of the SSM SecureString holding the Web Push (VAPID) private key. Must start with a slash.
  VapidSubject:
    Type: String
    Default: https://github.com  # ponytail: a placeholder that signs; set it to mailto:<the owner's address>
    Description: Contact sent to the push services with every notification, as mailto:<address> or https://<host> (no path).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Tracing: Active

Resources:
  # The three resources below hold what cannot be made again (the accounts, every home's data, the uploads).
  # Retain: deleting or replacing the stack leaves them standing, to be removed by hand and on purpose.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # One table: HOUSE#<id> (META, MEMBER#<sub>, READING#<date>, VERDICT#<date>, ACTION#<date>, SHOT#<id>,
  # PUSH#<hash>), USER#<sub> -> HOUSE#<id>, HOUSES -> <id>, INVITE#<code> and JOINFAIL#<sub> (expire through TTL).
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:  # any second of the last 35 days can be restored to a new table
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref WebOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE]
      # Per route, across all callers. ponytail: no per-person limit; put WAF or a usage plan in front
      # when there are enough users for one of them to crowd out the rest.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        'POST /join':  # invite codes are six letters: slow down guessing (the handler also counts misses per person)
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # The nightly run reads the demo inverter once per house.
        'GET /mock/v1/plants/{plantId}/daily': {ThrottlingBurstLimit: 100, ThrottlingRateLimit: 50}
        'GET /mock/fleet/daily': {ThrottlingBurstLimit: 100, ThrottlingRateLimit: 50}
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.api.handler
      Runtime: python3.12
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref Table
          ANALYSIS_FUNCTION: !Ref AnalysisFunction
          VISION_FUNCTION: !Ref VisionFunction
          MESSAGE_FUNCTION: !Ref MessageFunction
          UPLOADS: !Ref Uploads
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - LambdaInvokePolicy:
            FunctionName: !Ref AnalysisFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VisionFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MessageFunction
        - S3WritePolicy:   # only to sign upload slots; the API never reads the images itself
            BucketName: !Ref Uploads
        - Statement:       # deleting a home deletes its screenshots
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt Uploads.Arn
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${Uploads.Arn}/*
      Events:
        StartUpload: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/screenshots'}}
        ReadScreenshot: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/screenshots/read'}}
        ScreenshotResult: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/screenshots/{shotId}'}}
        ConnectInverter: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/inverter'}}
        ReadVendorReply: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/vendor-reply'}}
        RecordAction: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/actions'}}
        GetVerdict: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/verdict'}}
        SaveSettings: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/settings'}}
        History: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/history'}}
        Me: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /me}}
        CreateHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: /houses}}
        Join: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: /join}}
        GetHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}'}}
        DeleteHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: DELETE, Path: '/houses/{houseId}'}}
        RemoveMember: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: DELETE, Path: '/houses/{houseId}/members/{sub}'}}
        SubscribePush: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/push'}}
        UnsubscribePush: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: DELETE, Path: '/houses/{houseId}/push'}}
        CreateInvite: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/invites'}}
        AddReading: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/readings'}}
        ListReadings: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/readings'}}

  # pvlib physics + verdict rules. A container image because pvlib and pandas exceed the zip limit.
  # Runs on demand when new data arrives, and every night: the scheduled run starts one run per house.
  AnalysisFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: backend
    Properties:
      PackageType: Image
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          TABLE: !Ref Table
          VAPID_PARAM: !Ref VapidParam
          VAPID_SUBJECT: !Ref VapidSubject
      LoggingConfig:
        LogGroup: !Ref AnalysisLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            # Itself, once per house each night. By name pattern: a reference to its own ARN would be circular.
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AnalysisFunction-*
            # The key that signs Web Push notifications, and the decryption of that one SecureString.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VapidParam}
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      EventInvokeConfig:
        DestinationConfig:
          OnFailure: {Type: SQS, Destination: !GetAtt FailureQueue.Arn}
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(30 20 * * ? *)  # 02:00 IST

  # Screenshots, one folder per house. Private; uploads come through short-lived signed slots and are
  # deleted after 30 days.
  Uploads:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-screenshots, Status: Enabled, ExpirationInDays: 30}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref WebOrigin]
            AllowedMethods: [POST]
            AllowedHeaders: ['*']

  # Sorts a vendor's WhatsApp reply into four labels with Laya, fine-tuned on our replies (checkpoints.md).
  # A container image: PyTorch and 650 MB of weights. Called by the API and answers in about a second once
  # loaded; the ping keeps one container loaded, as for the screenshot reader.
  MessageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: messages
    Properties:
      PackageType: Image
      Timeout: 300  # a fresh container took over two minutes to pull PyTorch out of the image; after that, under a second
      MemorySize: 3008
      LoggingConfig:
        LogGroup: !Ref MessageLogGroup
      Events:
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warm": true}'

  # Reads an uploaded screenshot with a small vision model on CPU (Qwen3-VL-2B through llama.cpp).
  # A container image: the weights are 1.5 GB. 3008 MB is the most this account's Lambda may have.
  # It runs in the background, one screenshot per call, and writes what it read onto the screenshot's item.
  VisionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: vision
    Properties:
      PackageType: Image
      Timeout: 900
      MemorySize: 3008
      Environment:
        Variables:
          UPLOADS: !Ref Uploads
          TABLE: !Ref Table
      LoggingConfig:
        LogGroup: !Ref VisionLogGroup
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref Uploads
        - DynamoDBWritePolicy:
            TableName: !Ref Table
      EventInvokeConfig:
        MaximumRetryAttempts: 0  # a failed read is reported once, not retried for another fifteen minutes
        DestinationConfig:
          OnFailure: {Type: SQS, Destination: !GetAtt FailureQueue.Arn}
      Events:
        # Loading the 1.6 GB model into a fresh container takes about four minutes. A ping every five
        # minutes keeps one container loaded, so a homeowner waits about a minute instead.
        # ponytail: one warm container; use provisioned concurrency if several people upload at once.
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warm": true}'

  # Stands in for an inverter brand: an owner's app page, a keyed API and a fleet feed, all serving the
  # simulated neighbourhood. Outside our sign-in on purpose, as a real brand's service would be.
  MockInverterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.mock_inverter.handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref MockInverterLogGroup
      Events:
        App: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/app, Auth: {Authorizer: NONE}}}
        Plants: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/v1/plants, Auth: {Authorizer: NONE}}}
        Daily: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/mock/v1/plants/{plantId}/daily', Auth: {Authorizer: NONE}}}
        Fleet: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/fleet/daily, Auth: {Authorizer: NONE}}}

  # Named log groups kept for 30 days. New names: the /aws/lambda/... groups Lambda made by itself already
  # exist and cannot be taken over by the stack (they keep their old lines and can be deleted by hand).
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/api
      RetentionInDays: 30
  AnalysisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/analysis
      RetentionInDays: 30
  VisionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/vision
      RetentionInDays: 30
  MessageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/messages
      RetentionInDays: 30
  MockInverterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/mock-inverter
      RetentionInDays: 30

  # Failures are seen: a background run that failed for good (analysis after its retries, a screenshot read
  # at once) leaves its event here, and any message or any function error raises an alarm on the topic.
  FailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days, the most SQS keeps

  AlarmTopic:
    Type: AWS::SNS::Topic

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  FailureQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A background run failed for good; its event is waiting in the failure queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt FailureQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The API function catches what it did not foresee and answers 500, so its Errors metric only sees a crash
  # or a timeout. What a caller saw as a failure is counted here, as a share of all calls.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: One call in a hundred or more to the API was answered with a 5xx.
      Metrics:
        - Id: rate
          Expression: 100 * errors / requests
          Label: 5xx, percent of calls
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/ApiGateway, MetricName: 5xx, Dimensions: [{Name: ApiId, Value: !Ref Api}]}
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/ApiGateway, MetricName: Count, Dimensions: [{Name: ApiId, Value: !Ref Api}]}
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API function crashed or timed out (an error it caught is a 5xx, see Api5xxAlarm).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ApiFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  AnalysisErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A verdict run failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref AnalysisFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  VisionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The screenshot reader failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref VisionFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  MessageErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The vendor-reply reader failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref MessageFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  MockInverterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The demo inverter cloud failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref MockInverterFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  FailureQueueUrl:
    Value: !Ref FailureQueue
  AlarmTopicArn:
    Value: !Ref AlarmTopic
