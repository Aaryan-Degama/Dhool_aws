AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dhool backend. Cognito sign-in, HTTP API, DynamoDB, screenshot uploads read by a vision model, pvlib analysis, demo inverter cloud.

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # One table: HOUSE#<id> (META, MEMBER#<sub>, READING#<date>, VERDICT#<date>),
  # USER#<sub> -> HOUSE#<id>, INVITE#<code> (expires through TTL).
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']  # ponytail: tighten to the Amplify domain once it exists
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST]
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.api.handler
      Runtime: python3.12
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref Table
          ANALYSIS_FUNCTION: !Ref AnalysisFunction
          VISION_FUNCTION: !Ref VisionFunction
          UPLOADS: !Ref Uploads
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - LambdaInvokePolicy:
            FunctionName: !Ref AnalysisFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VisionFunction
        - S3WritePolicy:   # only to sign upload slots; the API never reads the images itself
            BucketName: !Ref Uploads
      Events:
        StartUpload: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/screenshots'}}
        ReadScreenshot: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/screenshots/read'}}
        ScreenshotResult: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/screenshots/{shotId}'}}
        ConnectInverter: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/inverter'}}
        GetVerdict: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/verdict'}}
        Me: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /me}}
        CreateHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: /houses}}
        Join: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: /join}}
        GetHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}'}}
        CreateInvite: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/invites'}}
        AddReading: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/readings'}}
        ListReadings: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/readings'}}

  # pvlib physics + verdict rules. A container image because pvlib and pandas exceed the zip limit.
  # Runs on demand when new data arrives, and every night for every house.
  AnalysisFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: backend
    Properties:
      PackageType: Image
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          TABLE: !Ref Table
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(30 20 * * ? *)  # 02:00 IST

  # Screenshots, one folder per house. Private; uploads come through short-lived signed slots and are
  # deleted after 30 days.
  Uploads:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - {Id: expire-screenshots, Status: Enabled, ExpirationInDays: 30}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']  # ponytail: tighten to the web app's domain once it exists
            AllowedMethods: [POST]
            AllowedHeaders: ['*']

  # Reads an uploaded screenshot with a small vision model on CPU (Qwen3-VL-2B through llama.cpp).
  # A container image: the weights are 1.5 GB. 3008 MB is the most this account's Lambda may have.
  # It runs in the background, one screenshot per call, and writes what it read onto the screenshot's item.
  VisionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: vision
    Properties:
      PackageType: Image
      Timeout: 900
      MemorySize: 3008
      Environment:
        Variables:
          UPLOADS: !Ref Uploads
          TABLE: !Ref Table
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref Uploads
        - DynamoDBWritePolicy:
            TableName: !Ref Table
      EventInvokeConfig:
        MaximumRetryAttempts: 0  # a failed read is reported once, not retried for another fifteen minutes
      Events:
        # Loading the 1.6 GB model into a fresh container takes about four minutes. A ping every five
        # minutes keeps one container loaded, so a homeowner waits about a minute instead.
        # ponytail: one warm container; use provisioned concurrency if several people upload at once.
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warm": true}'

  # Stands in for an inverter brand: an owner's app page, a keyed API and a fleet feed, all serving the
  # simulated neighbourhood. Outside our sign-in on purpose, as a real brand's service would be.
  MockInverterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.mock_inverter.handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 512
      Events:
        App: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/app, Auth: {Authorizer: NONE}}}
        Plants: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/v1/plants, Auth: {Authorizer: NONE}}}
        Daily: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/mock/v1/plants/{plantId}/daily', Auth: {Authorizer: NONE}}}
        Fleet: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/fleet/daily, Auth: {Authorizer: NONE}}}

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
