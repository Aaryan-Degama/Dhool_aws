AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dhool backend. Cognito sign-in, HTTP API, DynamoDB, screenshot uploads read by a vision model, pvlib analysis, demo inverter cloud.

Parameters:
  WebOrigin:
    Type: String
    Default: '*'  # ponytail: tighten to the Amplify URL once it exists (one override: WebOrigin=https://...)
    Description: The web app's origin, for CORS on the API and on screenshot uploads.
  AlarmEmail:
    Type: String
    Default: ''
    Description: Where alarms are emailed. Empty means the alarm topic has no subscriber.
  VapidParam:
    Type: String
    Default: /dhool/vapid-private-key
    Description: Name of the SSM SecureString holding the Web Push (VAPID) private key. Must start with a slash.
  VapidSubject:
    Type: String
    Default: https://github.com  # ponytail: a placeholder that signs; set it to mailto:<the owner's address>
    Description: Contact sent to the push services with every notification, as mailto:<address> or https://<host> (no path).

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]

Globals:
  Function:
    Tracing: Active

Resources:
  # The three resources below hold what cannot be made again (the accounts, every home's data, the uploads).
  # Retain: deleting or replacing the stack leaves them standing, to be removed by hand and on purpose.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # One table: HOUSE#<id> (META, MEMBER#<sub>, READING#<date>, VERDICT#<date>, ACTION#<date>, SHOT#<id>,
  # PUSH#<hash>), USER#<sub> -> HOUSE#<id>, HOUSES -> <id>, INVITE#<code>, JOINFAIL#<sub> and WXCACHE#<hash>
  # (the last three expire through TTL).
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:  # any second of the last 35 days can be restored to a new table
        PointInTimeRecoveryEnabled: true
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref WebOrigin]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE]
      # Per route, across all callers. ponytail: no per-person limit; put WAF or a usage plan in front
      # when there are enough users for one of them to crowd out the rest.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      RouteSettings:
        # This limit is shared by everyone joining anywhere, so at 1 a second one person with a script could
        # keep every family out. What stops guessing a six-letter code is the handler's count of each
        # person's wrong tries (five an hour); this only keeps a flood off the function.
        'POST /join':
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        # The nightly run reads the demo inverter once per house.
        'GET /mock/v1/plants/{plantId}/daily': {ThrottlingBurstLimit: 100, ThrottlingRateLimit: 50}
        'GET /mock/fleet/daily': {ThrottlingBurstLimit: 100, ThrottlingRateLimit: 50}
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.api.handler
      Runtime: python3.12
      Timeout: 25
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref Table
          ANALYSIS_FUNCTION: !Ref AnalysisFunction
          VISION_FUNCTION: !Ref VisionFunction
          MESSAGE_FUNCTION: !Ref MessageFunction
          UPLOADS: !Ref Uploads
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - LambdaInvokePolicy:
            FunctionName: !Ref AnalysisFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref VisionFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref MessageFunction
        - S3WritePolicy:   # only to sign upload slots; the API never reads the images itself
            BucketName: !Ref Uploads
        - Statement:       # deleting a home deletes its screenshots
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt Uploads.Arn
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${Uploads.Arn}/*
      Events:
        StartUpload: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/screenshots'}}
        ReadScreenshot: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/screenshots/read'}}
        ScreenshotResult: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/screenshots/{shotId}'}}
        ConnectInverter: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/inverter'}}
        ReadVendorReply: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/vendor-reply'}}
        RecordAction: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/actions'}}
        RecordFeedback: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/feedback'}}
        GetVerdict: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/verdict'}}
        SaveSettings: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/settings'}}
        History: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/history'}}
        Me: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /me}}
        CreateHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: /houses}}
        Join: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: /join}}
        GetHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}'}}
        DeleteHouse: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: DELETE, Path: '/houses/{houseId}'}}
        RemoveMember: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: DELETE, Path: '/houses/{houseId}/members/{sub}'}}
        SubscribePush: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/push'}}
        UnsubscribePush: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: DELETE, Path: '/houses/{houseId}/push'}}
        CreateInvite: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/invites'}}
        AddReading: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: POST, Path: '/houses/{houseId}/readings'}}
        ListReadings: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/houses/{houseId}/readings'}}

  # pvlib physics + verdict rules. A container image because pvlib and pandas exceed the zip limit.
  # Runs on demand when new data arrives, and every night: the scheduled run starts one run per house.
  AnalysisFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: backend
    Properties:
      PackageType: Image
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          TABLE: !Ref Table
          VAPID_PARAM: !Ref VapidParam
          VAPID_SUBJECT: !Ref VapidSubject
      LoggingConfig:
        LogGroup: !Ref AnalysisLogGroup
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
        - Statement:
            # Itself, once per house each night. By name pattern: a reference to its own ARN would be circular.
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-AnalysisFunction-*
            # The key that signs Web Push notifications, and the decryption of that one SecureString.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${VapidParam}
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
              Condition:
                StringEquals:
                  kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      EventInvokeConfig:
        DestinationConfig:
          OnFailure: {Type: SQS, Destination: !GetAtt FailureQueue.Arn}
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: cron(30 20 * * ? *)  # 02:00 IST

  # Screenshots, one folder per house. Private; uploads come through short-lived signed slots and are
  # deleted after 30 days.
  Uploads:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-screenshots, Status: Enabled, ExpirationInDays: 30}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref WebOrigin]
            AllowedMethods: [POST]
            AllowedHeaders: ['*']

  # Sorts a vendor's WhatsApp reply into four labels with Laya, fine-tuned on our replies (checkpoints.md).
  # A container image: PyTorch and 650 MB of weights. Called by the API and answers in about a second once
  # loaded; the ping keeps one container loaded, as for the screenshot reader.
  MessageFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: messages
    Properties:
      PackageType: Image
      Timeout: 300  # a fresh container took over two minutes to pull PyTorch out of the image; after that, under a second
      MemorySize: 3008
      LoggingConfig:
        LogGroup: !Ref MessageLogGroup
      Events:
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warm": true}'

  # Reads an uploaded screenshot with a small vision model on CPU (Qwen3-VL-2B through llama.cpp).
  # A container image: the weights are 1.5 GB. 3008 MB is the most this account's Lambda may have.
  # It runs in the background, one screenshot per call, and writes what it read onto the screenshot's item.
  VisionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: vision
    Properties:
      PackageType: Image
      Timeout: 900
      MemorySize: 3008
      Environment:
        Variables:
          UPLOADS: !Ref Uploads
          TABLE: !Ref Table
      LoggingConfig:
        LogGroup: !Ref VisionLogGroup
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref Uploads
        - DynamoDBWritePolicy:
            TableName: !Ref Table
      EventInvokeConfig:
        MaximumRetryAttempts: 0  # a failed read is reported once, not retried for another fifteen minutes
        DestinationConfig:
          OnFailure: {Type: SQS, Destination: !GetAtt FailureQueue.Arn}
      Events:
        # Loading the 1.6 GB model into a fresh container takes about four minutes. A ping every five
        # minutes keeps one container loaded, so a homeowner waits about a minute instead.
        # ponytail: one warm container; use provisioned concurrency if several people upload at once.
        KeepWarm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"warm": true}'

  # Stands in for an inverter brand: an owner's app page, a keyed API and a fleet feed, all serving the
  # simulated neighbourhood. Outside our sign-in on purpose, as a real brand's service would be.
  MockInverterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: handlers.mock_inverter.handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 512
      LoggingConfig:
        LogGroup: !Ref MockInverterLogGroup
      Events:
        App: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/app, Auth: {Authorizer: NONE}}}
        Plants: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/v1/plants, Auth: {Authorizer: NONE}}}
        Daily: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: '/mock/v1/plants/{plantId}/daily', Auth: {Authorizer: NONE}}}
        Fleet: {Type: HttpApi, Properties: {ApiId: !Ref Api, Method: GET, Path: /mock/fleet/daily, Auth: {Authorizer: NONE}}}

  # Named log groups kept for 30 days. New names: the /aws/lambda/... groups Lambda made by itself already
  # exist and cannot be taken over by the stack (they keep their old lines and can be deleted by hand).
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/api
      RetentionInDays: 30
  AnalysisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/analysis
      RetentionInDays: 30
  VisionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/vision
      RetentionInDays: 30
  MessageLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/messages
      RetentionInDays: 30
  MockInverterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /dhool/${AWS::StackName}/mock-inverter
      RetentionInDays: 30

  # Failures are seen: a background run that failed for good (analysis after its retries, a screenshot read
  # at once) leaves its event here, and any message or any function error raises an alarm on the topic.
  FailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600  # 14 days, the most SQS keeps

  AlarmTopic:
    Type: AWS::SNS::Topic

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  FailureQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A background run failed for good; its event is waiting in the failure queue.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - {Name: QueueName, Value: !GetAtt FailureQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # The API function catches what it did not foresee and answers 500, so its Errors metric only sees a crash
  # or a timeout. What a caller saw as a failure is counted here, as a share of all calls.
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: One call in a hundred or more to the API was answered with a 5xx.
      Metrics:
        - Id: rate
          Expression: 100 * errors / requests
          Label: 5xx, percent of calls
        - Id: errors
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/ApiGateway, MetricName: 5xx, Dimensions: [{Name: ApiId, Value: !Ref Api}]}
            Period: 300
            Stat: Sum
        - Id: requests
          ReturnData: false
          MetricStat:
            Metric: {Namespace: AWS/ApiGateway, MetricName: Count, Dimensions: [{Name: ApiId, Value: !Ref Api}]}
            Period: 300
            Stat: Sum
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API function crashed or timed out (an error it caught is a 5xx, see Api5xxAlarm).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref ApiFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  AnalysisErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A verdict run failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref AnalysisFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  VisionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The screenshot reader failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref VisionFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  MessageErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The vendor-reply reader failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref MessageFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
  MockInverterErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The demo inverter cloud failed.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - {Name: FunctionName, Value: !Ref MockInverterFunction}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Slow for everyone. Most routes answer in well under a second and a cold start adds a second or two, so
  # 5 s is far from normal and still a fifth of the API function's 25 s timeout: this rings before calls
  # start to time out. Three periods in a row, because on a quiet API the p95 of five minutes is its slowest
  # call, and one vendor reply read by a cold model takes up to 20 s.
  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The API is slow. One call in twenty took 5 seconds or more, for 15 minutes running.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - {Name: ApiId, Value: !Ref Api}
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 5000  # milliseconds
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # This account may run 10 Lambdas at once, and that is the real ceiling: a throttled API call is an error
  # for the caller and a throttled background run is late. With no dimension the metric counts every function
  # in the region in one alarm, so it also rings for any other stack in the account.
  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda turned a call away, the account being at its limit of 10 running at once (any function in the region, not only Dhool's).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # A run close to being cut off. 96,000 ms is 80% of AnalysisFunction's Timeout (0.8 x 120 s x 1000):
  # change the two together. The nightly starter paces itself to about 80 s and then stops or hands the
  # rest on, which is under this line.
  AnalysisDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Verdict runs are taking 96 seconds or more of the 120 they are allowed.
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - {Name: FunctionName, Value: !Ref AnalysisFunction}
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: 96000  # milliseconds
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # DynamoDB publishes SystemErrors for each operation and never for the table as a whole, and an alarm
  # cannot search for metrics, so the operations the code calls are added up here (test_metrics.py keeps the
  # list equal to the code). FILL, because a metric with nothing to count has no data and a sum over it has
  # none either. One period of the last two, because a filled-in zero can stand in for a count that arrives
  # late (CloudWatch's own advice for FILL in an alarm).
  TableSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: DynamoDB failed a call on the table with an error of its own (HTTP 500).
      Metrics:
        - Id: total
          Expression: SUM(FILL(METRICS(), 0))
          Label: System errors, all operations
        - {Id: getItem, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: SystemErrors,
            Dimensions: [{Name: TableName, Value: !Ref Table}, {Name: Operation, Value: GetItem}]}}}
        - {Id: putItem, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: SystemErrors,
            Dimensions: [{Name: TableName, Value: !Ref Table}, {Name: Operation, Value: PutItem}]}}}
        - {Id: updateItem, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: SystemErrors,
            Dimensions: [{Name: TableName, Value: !Ref Table}, {Name: Operation, Value: UpdateItem}]}}}
        - {Id: deleteItem, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: SystemErrors,
            Dimensions: [{Name: TableName, Value: !Ref Table}, {Name: Operation, Value: DeleteItem}]}}}
        - {Id: query, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: SystemErrors,
            Dimensions: [{Name: TableName, Value: !Ref Table}, {Name: Operation, Value: Query}]}}}
        - {Id: batchWriteItem, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: SystemErrors,
            Dimensions: [{Name: TableName, Value: !Ref Table}, {Name: Operation, Value: BatchWriteItem}]}}}
        - {Id: transactWriteItems, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: SystemErrors,
            Dimensions: [{Name: TableName, Value: !Ref Table}, {Name: Operation, Value: TransactWriteItems}]}}}
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # Throttling is counted for the table as a whole, reads and writes, so this needs no list of operations
  # and sees one added later. The table is on-demand and the traffic small: one throttled request is already
  # something to look at (a flood, or a loop). FILL and one period of two as above.
  TableThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: DynamoDB throttled a read or a write on the table.
      Metrics:
        - Id: total
          Expression: SUM(FILL(METRICS(), 0))
          Label: Throttled reads and writes
        - {Id: reads, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: ReadThrottleEvents,
            Dimensions: [{Name: TableName, Value: !Ref Table}]}}}
        - {Id: writes, ReturnData: false, MetricStat: {Period: 300, Stat: Sum, Metric: {Namespace: AWS/DynamoDB, MetricName: WriteThrottleEvents,
            Dimensions: [{Name: TableName, Value: !Ref Table}]}}}
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # FailureQueueAlarm rings once, when the first event arrives, and is then silent for as long as the queue
  # is not empty. This is the second ring: a failure nobody has dealt with for a day.
  FailureQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A failed run has been waiting in the failure queue for a day.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - {Name: QueueName, Value: !GetAtt FailureQueue.QueueName}
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 86400  # seconds: one day
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # What someone on call opens first: the API, the functions, the table, the failure queue, and the three
  # numbers the analysis writes itself (metric() in handlers/common.py, namespace Dhool). The lines drawn
  # across are the alarms' thresholds: move them with the alarms.
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref AWS::StackName
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "API: calls, and how many were errors", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [
              ["AWS/ApiGateway", "Count", "ApiId", "${Api}", {"label": "calls"}],
              ["AWS/ApiGateway", "4xx", "ApiId", "${Api}", {"label": "4xx"}],
              ["AWS/ApiGateway", "5xx", "ApiId", "${Api}", {"label": "5xx"}]]}},
          {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
            "title": "API: how long a call takes, ms", "region": "${AWS::Region}", "view": "timeSeries", "period": 300, "metrics": [
              ["AWS/ApiGateway", "Latency", "ApiId", "${Api}", {"stat": "p50", "label": "half of calls (p50)"}],
              ["AWS/ApiGateway", "Latency", "ApiId", "${Api}", {"stat": "p95", "label": "p95"}],
              ["AWS/ApiGateway", "Latency", "ApiId", "${Api}", {"stat": "Maximum", "label": "slowest"}]],
            "annotations": {"horizontal": [{"label": "alarm: p95 for 15 minutes", "value": 5000}]}}},
          {"type": "metric", "x": 0, "y": 6, "width": 8, "height": 6, "properties": {
            "title": "Functions: errors", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [
              ["AWS/Lambda", "Errors", "FunctionName", "${ApiFunction}", {"label": "API"}],
              ["AWS/Lambda", "Errors", "FunctionName", "${AnalysisFunction}", {"label": "analysis"}],
              ["AWS/Lambda", "Errors", "FunctionName", "${VisionFunction}", {"label": "screenshot reader"}],
              ["AWS/Lambda", "Errors", "FunctionName", "${MessageFunction}", {"label": "vendor-reply reader"}],
              ["AWS/Lambda", "Errors", "FunctionName", "${MockInverterFunction}", {"label": "demo inverter"}]]}},
          {"type": "metric", "x": 8, "y": 6, "width": 8, "height": 6, "properties": {
            "title": "Functions: p95 duration, ms (analysis and screenshot reader on the right)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "p95", "period": 300, "metrics": [
              ["AWS/Lambda", "Duration", "FunctionName", "${ApiFunction}", {"label": "API"}],
              ["AWS/Lambda", "Duration", "FunctionName", "${MessageFunction}", {"label": "vendor-reply reader"}],
              ["AWS/Lambda", "Duration", "FunctionName", "${MockInverterFunction}", {"label": "demo inverter"}],
              ["AWS/Lambda", "Duration", "FunctionName", "${AnalysisFunction}", {"yAxis": "right", "label": "analysis"}],
              ["AWS/Lambda", "Duration", "FunctionName", "${VisionFunction}", {"yAxis": "right", "label": "screenshot reader"}]],
            "annotations": {"horizontal": [{"label": "alarm: analysis at 80% of its timeout", "value": 96000, "yAxis": "right"}]}}},
          {"type": "metric", "x": 16, "y": 6, "width": 8, "height": 6, "properties": {
            "title": "Lambda: calls turned away, and how many ran at once (right)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [
              ["AWS/Lambda", "Throttles", {"label": "turned away, whole account"}],
              ["AWS/Lambda", "Throttles", "FunctionName", "${ApiFunction}", {"label": "API"}],
              ["AWS/Lambda", "Throttles", "FunctionName", "${AnalysisFunction}", {"label": "analysis"}],
              ["AWS/Lambda", "Throttles", "FunctionName", "${VisionFunction}", {"label": "screenshot reader"}],
              ["AWS/Lambda", "Throttles", "FunctionName", "${MessageFunction}", {"label": "vendor-reply reader"}],
              ["AWS/Lambda", "Throttles", "FunctionName", "${MockInverterFunction}", {"label": "demo inverter"}],
              ["AWS/Lambda", "ConcurrentExecutions", {"stat": "Maximum", "yAxis": "right", "label": "running at once, whole account"}]],
            "annotations": {"horizontal": [{"label": "the account's limit", "value": 10, "yAxis": "right"}]}}},
          {"type": "metric", "x": 0, "y": 12, "width": 12, "height": 6, "properties": {
            "title": "Table: capacity used, and throttled requests (right)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [
              ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${Table}", {"label": "read units"}],
              ["AWS/DynamoDB", "ConsumedWriteCapacityUnits", "TableName", "${Table}", {"label": "write units"}],
              ["AWS/DynamoDB", "ReadThrottleEvents", "TableName", "${Table}", {"yAxis": "right", "label": "throttled reads"}],
              ["AWS/DynamoDB", "WriteThrottleEvents", "TableName", "${Table}", {"yAxis": "right", "label": "throttled writes"}]]}},
          {"type": "metric", "x": 12, "y": 12, "width": 12, "height": 6, "properties": {
            "title": "Failure queue: events waiting, and the age of the oldest in seconds (right)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 300, "metrics": [
              ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${FailureQueue.QueueName}", {"label": "waiting"}],
              ["AWS/SQS", "ApproximateAgeOfOldestMessage", "QueueName", "${FailureQueue.QueueName}", {"yAxis": "right", "label": "age of the oldest"}]],
            "annotations": {"horizontal": [{"label": "alarm: a day", "value": 86400, "yAxis": "right"}]}}},
          {"type": "metric", "x": 0, "y": 18, "width": 8, "height": 6, "properties": {
            "title": "Dhool: one house's run, ms", "region": "${AWS::Region}", "view": "timeSeries", "period": 300, "metrics": [
              ["Dhool", "HouseRunDuration", {"stat": "p50", "label": "half of runs (p50)"}],
              ["Dhool", "HouseRunDuration", {"stat": "p95", "label": "p95"}],
              ["Dhool", "HouseRunDuration", {"stat": "Maximum", "label": "slowest"}]]}},
          {"type": "metric", "x": 8, "y": 18, "width": 8, "height": 6, "properties": {
            "title": "Dhool: verdicts given, by the hour", "region": "${AWS::Region}", "view": "timeSeries", "stacked": true, "stat": "Sum", "period": 3600, "metrics": [
              ["Dhool", "Verdicts", "verdict", "OK", {"label": "all good (OK)"}],
              ["Dhool", "Verdicts", "verdict", "WAIT", {"label": "wait (WAIT)"}],
              ["Dhool", "Verdicts", "verdict", "CLEAN", {"label": "wash (CLEAN)"}],
              ["Dhool", "Verdicts", "verdict", "INSPECT", {"label": "call the vendor (INSPECT)"}]]}},
          {"type": "metric", "x": 16, "y": 18, "width": 8, "height": 6, "properties": {
            "title": "Dhool: weather calls Open-Meteo did not answer", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300, "metrics": [
              ["Dhool", "WeatherFailures", {"label": "failed calls"}]]}}
        ]}

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  FailureQueueUrl:
    Value: !Ref FailureQueue
  AlarmTopicArn:
    Value: !Ref AlarmTopic
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}'
