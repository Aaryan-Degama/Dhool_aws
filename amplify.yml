# Amplify Hosting builds and deploys the web app on every push to main.
# The app is connected as a monorepo with root `web` (AMPLIFY_MONOREPO_APP_ROOT=web).
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
